<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta property="og:title" content="Bản đồ Quy hoạch đô thị - TP Huế">
  <meta property="og:site_name" content="Bản đồ Quy hoạch đô thị - TP Huế">
  <meta property="og:image" content="/icons/og-wide.png?v=20261029">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Bản đồ Quy hoạch đô thị - TP Huế">
  <meta name="twitter:image" content="/icons/og-wide.png?v=20261029">
  <link rel="icon" href="icons/favicon.ico?v=20261027" sizes="16x16 32x32 48x48">
  <link rel="icon" href="icons/favicon-32.png?v=20261027" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=20261027">
  <title>Bản đồ Quy hoạch đô thị - TP Huế</title>
  <link rel="stylesheet" href="css/phan-tich-3d.css">
</head>
<body>
  <aside id="panel">
    <div class="panel-head">
      <h1>Phân tích điểm</h1>
      <p id="place" class="place">Đang xác định vị trí…</p>
      <div class="switch" role="group" aria-label="Cách xem khối">
        <button type="button" id="btnTach" aria-pressed="true">Tách lớp</button>
        <button type="button" id="btnGop" aria-pressed="false">Gộp khối</button>
      </div>
      <label id="gapRow" class="gap">
        <span>Khoảng cách lớp</span>
        <input id="gap" type="range" min="0.4" max="2" step="0.05" value="1">
      </label>
    </div>
    <section>
      <h2>Bốn lớp</h2>
      <ul id="legend" class="legend"></ul>
      <ul id="keys" class="keys"></ul>
    </section>
    <section>
      <h2>Trong vòng tròn</h2>
      <p id="status" class="status">Đang đọc dấu chân công trình và dữ liệu mở…</p>
      <ul id="stats" class="stats"></ul>
    </section>
    <section>
      <h2>Nhà cao đã công bố</h2>
      <p id="massingNote" class="src"></p>
      <div id="massing"></div>
    </section>
    <p id="src" class="src"></p>
  </aside>
  <div id="map" role="region" aria-label="Khối ba chiều">
    <p id="modeChip">Tách bốn lớp</p>
  </div>
  <script src="https://unpkg.com/deck.gl@8.9.36/dist.min.js"></script>
  <script type="module" src="js/phanTich3d.js"></script>
</body>
</html>
