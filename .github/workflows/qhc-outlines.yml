name: QHC outlines

on:
  push:
    branches: [main]
  pull_request:

jobs:
  outlines:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install duckdb
        run: python3 -m pip install --disable-pip-version-check duckdb
      - name: Install Chrome
        run: |
          if ! command -v google-chrome-stable >/dev/null 2>&1 && ! command -v google-chrome >/dev/null 2>&1; then
            wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
            sudo apt-get update
            sudo apt-get install -y /tmp/chrome.deb
          fi
      - run: npm test
      - run: npm install --no-save --no-package-lock playwright-core@1.49.1
      - run: npm run test:qhc-outlines
        env:
          QHC_SHOT_DIR: /tmp/qhc-shots
