# Dò secret Actions (chỉ in có/không). Không in giá trị.
name: Upload quy che

on:
  push:
    branches:
      - cursor/quy-che-kien-truc-pdf-e3d5

jobs:
  probe-repo:
    runs-on: ubuntu-latest
    steps:
      - name: Ten secret nao co gia tri
        run: |
          echo "env=repo"
          echo "GCP_SA_KEY=${{ secrets.GCP_SA_KEY != '' }}"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT != '' }}"
          echo "GEE_PRIVATE_KEY=${{ secrets.GEE_PRIVATE_KEY != '' }}"
          echo "GAS_SECRET=${{ secrets.GAS_SECRET != '' }}"
          echo "GAS_BASE_URL=${{ secrets.GAS_BASE_URL != '' }}"
          echo "GOOGLE_CREDENTIALS=${{ secrets.GOOGLE_CREDENTIALS != '' }}"
          echo "GCP_CREDENTIALS=${{ secrets.GCP_CREDENTIALS != '' }}"
          echo "GCP_SA_JSON=${{ secrets.GCP_SA_JSON != '' }}"
          echo "SERVICE_ACCOUNT_KEY=${{ secrets.SERVICE_ACCOUNT_KEY != '' }}"
          echo "GCLOUD_KEY=${{ secrets.GCLOUD_KEY != '' }}"
          echo "CLOUDFLARE_API_TOKEN=${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"
          echo "CF_API_TOKEN=${{ secrets.CF_API_TOKEN != '' }}"
          echo "WRANGLER_API_TOKEN=${{ secrets.WRANGLER_API_TOKEN != '' }}"
  probe-preview:
    runs-on: ubuntu-latest
    environment: Preview
    steps:
      - name: Ten secret nao co gia tri
        run: |
          echo "env=Preview"
          echo "GCP_SA_KEY=${{ secrets.GCP_SA_KEY != '' }}"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT != '' }}"
          echo "GEE_PRIVATE_KEY=${{ secrets.GEE_PRIVATE_KEY != '' }}"
          echo "GAS_SECRET=${{ secrets.GAS_SECRET != '' }}"
          echo "GAS_BASE_URL=${{ secrets.GAS_BASE_URL != '' }}"
          echo "GOOGLE_CREDENTIALS=${{ secrets.GOOGLE_CREDENTIALS != '' }}"
          echo "GCP_CREDENTIALS=${{ secrets.GCP_CREDENTIALS != '' }}"
          echo "GCP_SA_JSON=${{ secrets.GCP_SA_JSON != '' }}"
          echo "SERVICE_ACCOUNT_KEY=${{ secrets.SERVICE_ACCOUNT_KEY != '' }}"
          echo "GCLOUD_KEY=${{ secrets.GCLOUD_KEY != '' }}"
  probe-production:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Ten secret nao co gia tri
        run: |
          echo "env=Production"
          echo "GCP_SA_KEY=${{ secrets.GCP_SA_KEY != '' }}"
          echo "GCP_PROJECT=${{ secrets.GCP_PROJECT != '' }}"
          echo "GEE_PRIVATE_KEY=${{ secrets.GEE_PRIVATE_KEY != '' }}"
          echo "GAS_SECRET=${{ secrets.GAS_SECRET != '' }}"
          echo "GAS_BASE_URL=${{ secrets.GAS_BASE_URL != '' }}"
          echo "GOOGLE_CREDENTIALS=${{ secrets.GOOGLE_CREDENTIALS != '' }}"
          echo "GCP_CREDENTIALS=${{ secrets.GCP_CREDENTIALS != '' }}"
          echo "GCP_SA_JSON=${{ secrets.GCP_SA_JSON != '' }}"
          echo "SERVICE_ACCOUNT_KEY=${{ secrets.SERVICE_ACCOUNT_KEY != '' }}"
          echo "GCLOUD_KEY=${{ secrets.GCLOUD_KEY != '' }}"
